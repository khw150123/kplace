<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>kplace — 한국 지도 픽셀 캔버스</title>
<style>
  :root{
    --bg: #0c1118;
    --bg-panel: #121826;
    --line: rgba(255,255,255,0.08);
    --text: #e8ecf3;
    --text-dim: #7c8698;
    --accent-red: #d63447;
    --accent-blue: #2e6fd6;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family: var(--sans); overflow:hidden;
  }

  #app{ position:relative; width:100vw; height:100vh; }
  #map{ position:absolute; inset:0; }

  #grid-canvas{ position:absolute; inset:0; pointer-events:none; }
  #click-catcher{
    position:absolute; inset:0; z-index:5; cursor:crosshair;
    touch-action:none; /* 브라우저 기본 스크롤/줌 제스처와 충돌 방지 */
  }

  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:linear-gradient(180deg, rgba(12,17,24,0.92), rgba(12,17,24,0));
    pointer-events:none;
  }
  header *{ pointer-events:auto; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .k{ font-family: var(--mono); font-weight:700; font-size:20px; letter-spacing:-0.5px; }
  .brand .k .dot-r{ color:var(--accent-red); }
  .brand .tag{ font-size:11px; color:var(--text-dim); font-family:var(--mono); }
  .stat-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .stat{
    font-family: var(--mono); font-size:12px; color:var(--text-dim);
    background:var(--bg-panel); border:1px solid var(--line);
    padding:6px 10px; border-radius:6px;
  }
  .stat b{ color:var(--text); font-weight:600; }

  #palette-bar{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:20;
    display:flex; align-items:center; gap:10px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:10px 14px;
    border-radius:14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    max-width:92vw;
  }
  #swatches{ display:flex; gap:6px; flex-wrap:wrap; max-width:180px; }
  .swatch{
    width:26px; height:26px; border-radius:6px; cursor:pointer;
    border:2px solid transparent;
    transition: transform 0.08s ease;
    flex-shrink:0;
  }
  .swatch:hover{ transform: translateY(-2px); }
  .swatch.active{ border-color:#fff; transform: translateY(-2px); }
  #cooldown-pill{
    font-family: var(--mono); font-size:12px;
    padding:6px 12px; border-radius:8px;
    background:rgba(255,255,255,0.05);
    color:var(--text-dim);
    min-width:80px; text-align:center;
    flex-shrink:0;
  }
  #cooldown-pill.ready{ color:#7be0a8; }

  #image-upload-btn{
    font-family: var(--mono); font-size:12px;
    padding:6px 12px; border-radius:8px;
    background:rgba(46,111,214,0.18);
    color:#8fb6f2;
    border:1px solid rgba(46,111,214,0.4);
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  #image-upload-btn:hover{ background:rgba(46,111,214,0.3); }

  #toast{
    position:absolute; right:18px; bottom:22px; z-index:20;
    background:var(--bg-panel); border:1px solid var(--line);
    padding:10px 14px; border-radius:10px;
    font-size:13px; color:var(--text);
    max-width:260px; opacity:0; transform:translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translateY(0); }

  #zoom-hint{
    position:absolute; top:70px; left:18px; z-index:20;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    background:var(--bg-panel); border:1px solid var(--line);
    padding:6px 10px; border-radius:6px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>
  <canvas id="grid-canvas"></canvas>
  <div id="click-catcher"></div>

  <header>
    <div class="brand">
      <div class="k"><span class="dot-r">k</span>place</div>
      <div class="tag">/// KOREA ONLY /// pixel canvas</div>
    </div>
    <div class="stat-group">
      <div class="stat">칠해진 픽셀 <b id="pixel-count">0</b></div>
      <div class="stat" id="distance-stat">활천초→돗대산 <b id="distance-value">-</b></div>
    </div>
  </header>

  <div id="zoom-hint">더 확대하면 격자선이 보여요 (탭은 확대 안 해도 됩니다)</div>

  <div id="palette-bar">
    <div id="swatches"></div>
    <div id="cooldown-pill" class="ready">준비완료</div>
    <label id="image-upload-btn" for="image-input">이미지 불러오기</label>
    <input type="file" id="image-input" accept="image/*" style="display:none" />
  </div>

  <div id="toast"></div>
</div>

<!-- ⚠️ 아래 appkey는 카카오 디벨로퍼스에 등록된 도메인(kplace.com, http://localhost:3000)에서만 정상 동작합니다. -->
<div id="fatal-error" style="display:none; position:fixed; inset:0; z-index:999; background:#0c1118; color:#e8ecf3; font-family:-apple-system,sans-serif; align-items:center; justify-content:center; text-align:center; padding:24px;">
  <div style="max-width:420px;">
    <div style="font-size:18px; font-weight:700; margin-bottom:10px;">카카오맵 SDK 로드 실패</div>
    <div style="font-size:14px; color:#7c8698; line-height:1.6;">
      이 페이지가 <b id="fatal-origin" style="color:#e8ecf3;"></b> 에서 열려 있습니다.<br/>
      카카오 디벨로퍼스 콘솔의 '플랫폼 &gt; Web'에 이 주소가 등록되어 있는지 확인해 주세요.
    </div>
  </div>
</div>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8dd9ca0cd4249ae72fc860956f9fee09&autoload=false"
        onerror="document.getElementById('fatal-error').style.display='flex'; document.getElementById('fatal-origin').textContent = window.location.origin || window.location.protocol;"></script>

<script>
/* ============================================================
   kplace 프로토타입
   - 지도: 카카오맵, 한국 영역으로 bounds 제한
   - 픽셀 그리드: 위경도를 고정 셀 크기로 스냅
   - 저장: localStorage (이 브라우저/기기에만 저장됨 — 실제 다중 사용자 공유 아님)
   - 조작: 탭=색칠, 드래그=지도 이동 (같은 레이어에서 제스처로 구분)
   - 이미지 불러오기: 사진을 축소해서 픽셀 색상 그대로 캔버스에 스탬프
   ============================================================ */

const CELL_DEG = 0.0015;
const COOLDOWN_MS = 30 * 1000;
const DRAG_THRESHOLD = 6; // 이 픽셀 이상 움직이면 "드래그"로 판정
const IMAGE_GRID_WIDTH = 48; // 이미지 변환 시 가로 칸 수
const PALETTE = [
  "#ffffff", "#d63447", "#f2994a", "#f2c94c",
  "#6fcf97", "#2e6fd6", "#9b51e0", "#111318",
  "#7c8698", "#0fb9b1", "#eb5757", "#56ccf2"
];

const KOREA_BOUNDS = { swLat: 33.0, swLng: 124.5, neLat: 39.6, neLng: 131.0 };

let selectedColor = PALETTE[1];
let map;
let pixels = loadPixels();

function loadPixels(){
  try{ return JSON.parse(localStorage.getItem("kplace_pixels") || "{}"); }
  catch(e){ return {}; }
}
function savePixel(key, color){
  pixels[key] = color;
  localStorage.setItem("kplace_pixels", JSON.stringify(pixels));
}
function getLastPlacedAt(){ return Number(localStorage.getItem("kplace_last_placed") || 0); }
function setLastPlacedAt(ts){ localStorage.setItem("kplace_last_placed", String(ts)); }

function snap(lat, lng){
  const sLat = Math.floor(lat / CELL_DEG) * CELL_DEG;
  const sLng = Math.floor(lng / CELL_DEG) * CELL_DEG;
  return { lat: sLat, lng: sLng, key: sLat.toFixed(6) + "_" + sLng.toFixed(6) };
}

function getDistance(a, b){
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.getLat() - a.getLat()) * rad;
  const dLng = (b.getLng() - a.getLng()) * rad;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.getLat()*rad) * Math.cos(b.getLat()*rad) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

if (typeof kakao === 'undefined'){
  document.getElementById('fatal-error').style.display = 'flex';
  document.getElementById('fatal-origin').textContent = window.location.origin || window.location.protocol;
  throw new Error('kakao SDK가 로드되지 않았습니다');
}

kakao.maps.load(function(){
  const container = document.getElementById('map');
  map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(36.2, 127.9),
    level: 10
  });

  // 활천초 -> 돗대산 거리 표시
  const startPos = new kakao.maps.LatLng(35.2287, 128.8395);
  const endPos   = new kakao.maps.LatLng(35.1975, 128.9130);
  new kakao.maps.Marker({ position: startPos, map: map });
  new kakao.maps.Marker({ position: endPos, map: map });
  new kakao.maps.Polyline({
    path: [startPos, endPos],
    strokeWeight: 4, strokeColor: '#DB4455', strokeOpacity: 0.9, strokeStyle: 'solid'
  }).setMap(map);
  const dist = getDistance(startPos, endPos);
  document.getElementById('distance-value').textContent =
    dist >= 1000 ? (dist/1000).toFixed(2) + 'km' : Math.round(dist) + 'm';

  kakao.maps.event.addListener(map, 'zoom_changed', drawGrid);
  kakao.maps.event.addListener(map, 'idle', function(){ drawGrid(); clampToKorea(); });

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  drawGrid();
  buildPalette();
  attachGestureHandler();
  attachImageImport();
  tickCooldown();
  setInterval(tickCooldown, 500);
});

function clampToKorea(){
  const c = map.getCenter();
  let lat = c.getLat(), lng = c.getLng();
  lat = Math.min(Math.max(lat, KOREA_BOUNDS.swLat), KOREA_BOUNDS.neLat);
  lng = Math.min(Math.max(lng, KOREA_BOUNDS.swLng), KOREA_BOUNDS.neLng);
  if (lat !== c.getLat() || lng !== c.getLng()){
    map.setCenter(new kakao.maps.LatLng(lat, lng));
  }
}

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawGrid();
}

function drawGrid(){
  if (!map) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const level = map.getLevel();
  const proj = map.getProjection();
  const b = map.getBounds();
  const sw = b.getSouthWest(), ne = b.getNorthEast();

  document.getElementById('pixel-count').textContent = Object.keys(pixels).length;

  ctx.globalAlpha = 0.85;
  for (const key in pixels){
    const [latStr, lngStr] = key.split('_');
    const lat = parseFloat(latStr), lng = parseFloat(lngStr);
    if (lat < sw.getLat() - CELL_DEG || lat > ne.getLat() + CELL_DEG) continue;
    if (lng < sw.getLng() - CELL_DEG || lng > ne.getLng() + CELL_DEG) continue;
    drawCell(proj, lat, lng, pixels[key]);
  }
  ctx.globalAlpha = 1;

  document.getElementById('zoom-hint').style.display = (level > 7) ? 'block' : 'none';
  if (level > 7) return; // 격자선만 생략, 색칠/이동은 항상 가능

  const startLat = Math.floor(sw.getLat() / CELL_DEG) * CELL_DEG;
  const startLng = Math.floor(sw.getLng() / CELL_DEG) * CELL_DEG;
  const p1 = proj.pointFromCoords(new kakao.maps.LatLng(startLat, startLng));
  const p2 = proj.pointFromCoords(new kakao.maps.LatLng(startLat + CELL_DEG, startLng + CELL_DEG));
  const cellPx = Math.abs(p2.y - p1.y);
  if (cellPx < 8) return;

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  for (let lat = startLat; lat <= ne.getLat() + CELL_DEG; lat += CELL_DEG){
    const pt = proj.pointFromCoords(new kakao.maps.LatLng(lat, sw.getLng()));
    ctx.beginPath(); ctx.moveTo(0, pt.y); ctx.lineTo(canvas.width, pt.y); ctx.stroke();
  }
  for (let lng = startLng; lng <= ne.getLng() + CELL_DEG; lng += CELL_DEG){
    const pt = proj.pointFromCoords(new kakao.maps.LatLng(sw.getLat(), lng));
    ctx.beginPath(); ctx.moveTo(pt.x, 0); ctx.lineTo(pt.x, canvas.height); ctx.stroke();
  }
}

function drawCell(proj, lat, lng, color){
  const p1 = proj.pointFromCoords(new kakao.maps.LatLng(lat, lng));
  const p2 = proj.pointFromCoords(new kakao.maps.LatLng(lat + CELL_DEG, lng + CELL_DEG));
  const x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y);
  const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w + 1, h + 1);
}

function buildPalette(){
  const wrap = document.getElementById('swatches');
  PALETTE.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === 1 ? ' active' : '');
    el.style.background = c;
    el.addEventListener('click', () => {
      selectedColor = c;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
    });
    wrap.appendChild(el);
  });
}

// ---------- 탭(색칠) vs 드래그(지도 이동) 제스처 처리 ----------
function attachGestureHandler(){
  const catcher = document.getElementById('click-catcher');
  let dragging = false;
  let startX = 0, startY = 0, lastX = 0, lastY = 0;
  let activePointerId = null;

  catcher.addEventListener('pointerdown', (e) => {
    dragging = false;
    startX = lastX = e.clientX;
    startY = lastY = e.clientY;
    activePointerId = e.pointerId;
    catcher.setPointerCapture(e.pointerId);
  });

  catcher.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    const movedTotal = Math.hypot(e.clientX - startX, e.clientY - startY);
    if (movedTotal > DRAG_THRESHOLD){
      dragging = true;
      map.panBy(-dx, -dy);
    }
    lastX = e.clientX;
    lastY = e.clientY;
  });

  catcher.addEventListener('pointerup', (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    if (dragging) return; // 드래그였으면 색칠 안 함

    const remaining = COOLDOWN_MS - (Date.now() - getLastPlacedAt());
    if (remaining > 0){
      showToast('쿨다운 중: ' + Math.ceil(remaining / 1000) + '초 남음');
      return;
    }
    const proj = map.getProjection();
    const rect = canvas.getBoundingClientRect();
    const point = new kakao.maps.Point(e.clientX - rect.left, e.clientY - rect.top);
    const coords = proj.coordsFromPoint(point);
    const { lat, lng, key } = snap(coords.getLat(), coords.getLng());

    savePixel(key, selectedColor);
    setLastPlacedAt(Date.now());
    drawGrid();
    showToast('픽셀 완료: ' + lat.toFixed(4) + ', ' + lng.toFixed(4));
  });

  catcher.addEventListener('pointercancel', () => { activePointerId = null; dragging = false; });
}

function tickCooldown(){
  const remaining = COOLDOWN_MS - (Date.now() - getLastPlacedAt());
  const pill = document.getElementById('cooldown-pill');
  if (remaining <= 0){
    pill.textContent = '준비완료';
    pill.classList.add('ready');
  } else {
    pill.textContent = Math.ceil(remaining / 1000) + '초 대기';
    pill.classList.remove('ready');
  }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- 이미지 불러와서 픽셀로 변환 ----------
function attachImageImport(){
  document.getElementById('image-input').addEventListener('change', function(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = () => importImageAsPixels(img);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = ''; // 같은 파일 다시 선택 가능하도록 초기화
  });
}

function importImageAsPixels(img){
  const targetW = IMAGE_GRID_WIDTH;
  const targetH = Math.max(1, Math.round(targetW * (img.height / img.width)));

  const off = document.createElement('canvas');
  off.width = targetW; off.height = targetH;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0, targetW, targetH);
  const data = octx.getImageData(0, 0, targetW, targetH).data;

  // 현재 지도 중심을 기준으로 그리드에 맞춰 이미지를 배치
  const center = map.getCenter();
  const anchor = snap(center.getLat(), center.getLng());
  const anchorLat = anchor.lat + (targetH / 2) * CELL_DEG;
  const anchorLng = anchor.lng - (targetW / 2) * CELL_DEG;

  let placed = 0;
  for (let row = 0; row < targetH; row++){
    for (let col = 0; col < targetW; col++){
      const i = (row * targetW + col) * 4;
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      if (a < 64) continue; // 투명한 부분은 건너뜀

      const lat = anchorLat - row * CELL_DEG;
      const lng = anchorLng + col * CELL_DEG;
      const { key } = snap(lat, lng);
      const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
      pixels[key] = hex;
      placed++;
    }
  }
  localStorage.setItem('kplace_pixels', JSON.stringify(pixels));
  drawGrid();
  showToast(targetW + '×' + targetH + ' 이미지에서 ' + placed + '개 픽셀을 찍었어요');
}
</script>
</body>
</html>
