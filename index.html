<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>kplace — 한국 지도 픽셀 캔버스</title>
<style>
  :root{
    --bg: #0c1118;
    --bg-panel: #121826;
    --line: rgba(255,255,255,0.08);
    --text: #e8ecf3;
    --text-dim: #7c8698;
    --accent-red: #d63447;
    --accent-blue: #2e6fd6;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family: var(--sans); overflow:hidden;
  }

  #app{ position:relative; width:100vw; height:100vh; }
  #map{ position:absolute; inset:0; }

  /* 픽셀 그리드 오버레이 */
  #grid-canvas{
    position:absolute; inset:0; pointer-events:none;
  }
  #click-catcher{
    position:absolute; inset:0; z-index:5; cursor:crosshair;
  }

  /* 상단 헤더 */
  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:linear-gradient(180deg, rgba(12,17,24,0.92), rgba(12,17,24,0));
    pointer-events:none;
  }
  header *{ pointer-events:auto; }
  .brand{
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .k{
    font-family: var(--mono); font-weight:700; font-size:20px; letter-spacing:-0.5px;
  }
  .brand .k .dot-r{ color:var(--accent-red); }
  .brand .k .dot-b{ color:var(--accent-blue); }
  .brand .tag{
    font-size:11px; color:var(--text-dim); font-family:var(--mono);
  }
  .stat{
    font-family: var(--mono); font-size:12px; color:var(--text-dim);
    background:var(--bg-panel); border:1px solid var(--line);
    padding:6px 10px; border-radius:6px;
  }
  .stat b{ color:var(--text); font-weight:600; }

  /* 하단 팔레트 바 */
  #palette-bar{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:20;
    display:flex; align-items:center; gap:10px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:10px 14px;
    border-radius:14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  #swatches{ display:flex; gap:6px; }
  .swatch{
    width:26px; height:26px; border-radius:6px; cursor:pointer;
    border:2px solid transparent;
    transition: transform 0.08s ease;
  }
  .swatch:hover{ transform: translateY(-2px); }
  .swatch.active{
    border-color:#fff; transform: translateY(-2px);
  }
  #cooldown-pill{
    font-family: var(--mono); font-size:12px;
    padding:6px 12px; border-radius:8px;
    background:rgba(255,255,255,0.05);
    color:var(--text-dim);
    min-width:96px; text-align:center;
  }
  #cooldown-pill.ready{ color:#7be0a8; }

  /* 우측 하단 안내 토스트 */
  #toast{
    position:absolute; right:18px; bottom:22px; z-index:20;
    background:var(--bg-panel); border:1px solid var(--line);
    padding:10px 14px; border-radius:10px;
    font-size:13px; color:var(--text);
    max-width:260px; opacity:0; transform:translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translateY(0); }

  #zoom-hint{
    position:absolute; top:70px; left:18px; z-index:20;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    background:var(--bg-panel); border:1px solid var(--line);
    padding:6px 10px; border-radius:6px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>
  <canvas id="grid-canvas"></canvas>
  <div id="click-catcher"></div>

  <header>
    <div class="brand">
      <div class="k"><span class="dot-r">k</span>place</div>
      <div class="tag">/// KOREA ONLY /// pixel canvas</div>
    </div>
    <div class="stat">칠해진 픽셀 <b id="pixel-count">0</b></div>
  </header>

  <div id="zoom-hint">그리드가 안 보이면 더 확대(zoom in)하세요</div>

  <div id="palette-bar">
    <div id="swatches"></div>
    <div id="cooldown-pill" class="ready">찍을 준비 완료</div>
  </div>

  <div id="toast"></div>
</div>

<!-- ⚠️ 아래 appkey는 카카오 디벨로퍼스에 등록된 도메인(kplace.com, http://localhost:3000)에서만 정상 동작합니다.
     다른 도메인(예: file://로 직접 열거나, 등록 안 된 호스트)에서는 스크립트 자체가 로드되지 않습니다. -->
<div id="fatal-error" style="display:none; position:fixed; inset:0; z-index:999; background:#0c1118; color:#e8ecf3; font-family:-apple-system,sans-serif; align-items:center; justify-content:center; text-align:center; padding:24px;">
  <div style="max-width:420px;">
    <div style="font-size:18px; font-weight:700; margin-bottom:10px;">카카오맵 SDK 로드 실패</div>
    <div style="font-size:14px; color:#7c8698; line-height:1.6;">
      이 페이지가 <b id="fatal-origin" style="color:#e8ecf3;"></b> 에서 열려 있습니다.<br/>
      카카오 디벨로퍼스 콘솔의 '플랫폼 &gt; Web'에 이 주소가 등록되어 있는지,<br/>
      그리고 file:// 로 직접 연 게 아니라 로컬 서버(예: http://localhost:3000)로 접속했는지 확인해 주세요.
    </div>
  </div>
</div>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8dd9ca0cd4249ae72fc860956f9fee09&autoload=false"
        onerror="document.getElementById('fatal-error').style.display='flex'; document.getElementById('fatal-origin').textContent = window.location.origin || window.location.protocol;"></script>

<script>
/* ============================================================
   kplace 프로토타입
   - 지도: 카카오맵, 한국 영역으로 bounds 제한
   - 픽셀 그리드: 위경도를 고정 셀 크기로 스냅해서 사각형 격자를 만듦
   - 저장: localStorage (프로토타입용). 실서비스는 반드시 서버/실시간 DB로 교체할 것.
   ============================================================ */

const CELL_DEG = 0.0015; // 픽셀 한 칸의 위경도 크기 (약 150m 내외, 필요시 조정)
const COOLDOWN_MS = 30 * 1000; // 픽셀 하나 찍은 뒤 대기시간
const PALETTE = [
  "#ffffff", "#d63447", "#f2994a", "#f2c94c",
  "#6fcf97", "#2e6fd6", "#9b51e0", "#111318",
  "#7c8698", "#0fb9b1", "#eb5757", "#56ccf2"
];

// 한국 영역(대략) — 이 범위 밖으로는 지도가 안 움직이게 제한
const KOREA_BOUNDS = { swLat: 33.0, swLng: 124.5, neLat: 39.6, neLng: 131.0 };

let selectedColor = PALETTE[1];
let map, kakaoBounds;
let pixels = loadPixels(); // key: "lat_lng" (스냅된 좌표) -> color

// ---------- 저장소 계층 (여기만 바꾸면 실서비스 백엔드로 교체 가능) ----------
function loadPixels(){
  try{
    return JSON.parse(localStorage.getItem("kplace_pixels") || "{}");
  }catch(e){ return {}; }
}
function savePixel(key, color){
  pixels[key] = color;
  localStorage.setItem("kplace_pixels", JSON.stringify(pixels));
  // TODO(실서비스): 여기서 서버/실시간 DB에 write 하고,
  // 다른 사용자에게는 websocket이나 구독으로 반영해야 모두가 같은 캔버스를 봄.
}
function getLastPlacedAt(){
  return Number(localStorage.getItem("kplace_last_placed") || 0);
}
function setLastPlacedAt(ts){
  localStorage.setItem("kplace_last_placed", String(ts));
}

// ---------- 좌표 <-> 그리드 스냅 ----------
function snap(lat, lng){
  const sLat = Math.floor(lat / CELL_DEG) * CELL_DEG;
  const sLng = Math.floor(lng / CELL_DEG) * CELL_DEG;
  return { lat: sLat, lng: sLng, key: sLat.toFixed(6) + "_" + sLng.toFixed(6) };
}

// ---------- 지도 초기화 ----------
if (typeof kakao === 'undefined'){
  document.getElementById('fatal-error').style.display = 'flex';
  document.getElementById('fatal-origin').textContent = window.location.origin || window.location.protocol;
  throw new Error('kakao SDK가 로드되지 않았습니다 (도메인 미등록 또는 file:// 접속 가능성)');
}

kakao.maps.load(function(){
  const container = document.getElementById('map');
  map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(36.2, 127.9),
    level: 10
  });

  kakaoBounds = new kakao.maps.LatLngBounds(
    new kakao.maps.LatLng(KOREA_BOUNDS.swLat, KOREA_BOUNDS.swLng),
    new kakao.maps.LatLng(KOREA_BOUNDS.neLat, KOREA_BOUNDS.neLng)
  );

  // 한국 밖으로 못 나가게: 이동 끝날 때마다 bounds 안으로 되돌림
  kakao.maps.event.addListener(map, 'dragend', clampToKorea);
  kakao.maps.event.addListener(map, 'zoom_changed', drawGrid);
  kakao.maps.event.addListener(map, 'center_changed', drawGrid);
  kakao.maps.event.addListener(map, 'idle', drawGrid);

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  drawGrid();
  buildPalette();
  attachClickHandler();
  tickCooldown();
  setInterval(tickCooldown, 500);
});

function clampToKorea(){
  const c = map.getCenter();
  let lat = c.getLat(), lng = c.getLng();
  lat = Math.min(Math.max(lat, KOREA_BOUNDS.swLat), KOREA_BOUNDS.neLat);
  lng = Math.min(Math.max(lng, KOREA_BOUNDS.swLng), KOREA_BOUNDS.neLng);
  if (lat !== c.getLat() || lng !== c.getLng()){
    map.setCenter(new kakao.maps.LatLng(lat, lng));
  }
}

// ---------- 그리드/픽셀 렌더링 (Canvas 오버레이) ----------
const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawGrid();
}

function drawGrid(){
  if (!map) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const level = map.getLevel();
  const proj = map.getProjection();
  const b = map.getBounds();
  const sw = b.getSouthWest(), ne = b.getNorthEast();

  document.getElementById('zoom-hint').style.display = (level > 7) ? 'block' : 'none';
  if (level > 7) return; // 너무 축소하면 격자 안 그림 (성능 + 가독성)

  const startLat = Math.floor(sw.getLat() / CELL_DEG) * CELL_DEG;
  const startLng = Math.floor(sw.getLng() / CELL_DEG) * CELL_DEG;

  // 1) 칠해진 픽셀 채우기
  ctx.globalAlpha = 0.85;
  for (const key in pixels){
    const [latStr, lngStr] = key.split('_');
    const lat = parseFloat(latStr), lng = parseFloat(lngStr);
    if (lat < sw.getLat() - CELL_DEG || lat > ne.getLat() + CELL_DEG) continue;
    if (lng < sw.getLng() - CELL_DEG || lng > ne.getLng() + CELL_DEG) continue;
    drawCell(proj, lat, lng, pixels[key]);
  }
  ctx.globalAlpha = 1;

  // 2) 격자선 (칸이 화면상 8px 이상일 때만)
  const p1 = proj.pointFromCoords(new kakao.maps.LatLng(startLat, startLng));
  const p2 = proj.pointFromCoords(new kakao.maps.LatLng(startLat + CELL_DEG, startLng + CELL_DEG));
  const cellPx = Math.abs(p2.y - p1.y);
  if (cellPx < 8) return;

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  for (let lat = startLat; lat <= ne.getLat() + CELL_DEG; lat += CELL_DEG){
    const pt = proj.pointFromCoords(new kakao.maps.LatLng(lat, sw.getLng()));
    ctx.beginPath(); ctx.moveTo(0, pt.y); ctx.lineTo(canvas.width, pt.y); ctx.stroke();
  }
  for (let lng = startLng; lng <= ne.getLng() + CELL_DEG; lng += CELL_DEG){
    const pt = proj.pointFromCoords(new kakao.maps.LatLng(sw.getLat(), lng));
    ctx.beginPath(); ctx.moveTo(pt.x, 0); ctx.lineTo(pt.x, canvas.height); ctx.stroke();
  }

  document.getElementById('pixel-count').textContent = Object.keys(pixels).length;
}

function drawCell(proj, lat, lng, color){
  const p1 = proj.pointFromCoords(new kakao.maps.LatLng(lat, lng));
  const p2 = proj.pointFromCoords(new kakao.maps.LatLng(lat + CELL_DEG, lng + CELL_DEG));
  const x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y);
  const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w + 1, h + 1);
}

// ---------- 팔레트 UI ----------
function buildPalette(){
  const wrap = document.getElementById('swatches');
  PALETTE.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === 1 ? ' active' : '');
    el.style.background = c;
    el.addEventListener('click', () => {
      selectedColor = c;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
    });
    wrap.appendChild(el);
  });
}

// ---------- 클릭으로 픽셀 찍기 ----------
function attachClickHandler(){
  const catcher = document.getElementById('click-catcher');
  catcher.addEventListener('click', (e) => {
    if (map.getLevel() > 7){
      showToast('격자가 보일 때까지 확대해야 픽셀을 찍을 수 있어요');
      return;
    }
    const remaining = COOLDOWN_MS - (Date.now() - getLastPlacedAt());
    if (remaining > 0){
      showToast('쿨다운 중: ' + Math.ceil(remaining / 1000) + '초 남음');
      return;
    }
    const proj = map.getProjection();
    const rect = canvas.getBoundingClientRect();
    const point = new kakao.maps.Point(e.clientX - rect.left, e.clientY - rect.top);
    const coords = proj.coordsFromPoint(point);
    const { lat, lng, key } = snap(coords.getLat(), coords.getLng());

    savePixel(key, selectedColor);
    setLastPlacedAt(Date.now());
    drawGrid();
    showToast('픽셀 완료: ' + lat.toFixed(4) + ', ' + lng.toFixed(4));
  });
}

function tickCooldown(){
  const remaining = COOLDOWN_MS - (Date.now() - getLastPlacedAt());
  const pill = document.getElementById('cooldown-pill');
  if (remaining <= 0){
    pill.textContent = '찍을 준비 완료';
    pill.classList.add('ready');
  } else {
    pill.textContent = Math.ceil(remaining / 1000) + '초 대기';
    pill.classList.remove('ready');
  }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>

</body>
</html>
